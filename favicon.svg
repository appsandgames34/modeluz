<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ringTop" x1="366" y1="107" x2="140" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4b81c"/>
      <stop offset="0.4" stop-color="#17315a"/>
      <stop offset="1" stop-color="#17315a"/>
    </linearGradient>
    <linearGradient id="ringBottom" x1="74" y1="252" x2="368" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17315a"/>
      <stop offset="0.5" stop-color="#17315a"/>
      <stop offset="1" stop-color="#5bb134"/>
    </linearGradient>
    <linearGradient id="mFill" x1="185" y1="256" x2="327" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17315a"/>
      <stop offset="0.5" stop-color="#17315a"/>
      <stop offset="1" stop-color="#f4b81c"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="352" y1="405" x2="432" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f9e2a"/>
      <stop offset="1" stop-color="#6cc63f"/>
    </linearGradient>
  </defs>

  <!-- Anillo: tramo dorado -> azul marino (baja hasta 6:00, extremo inferior oculto) -->
  <path d="M 366 107 A 182 182 0 1 0 256 434" stroke="url(#ringTop)" stroke-width="32" stroke-linecap="round"/>
  <!-- Anillo: tramo azul marino -> verde (solapa el izquierdo, sin costura visible) -->
  <path d="M 74 252 A 182 182 0 0 0 368 395" stroke="url(#ringBottom)" stroke-width="32" stroke-linecap="round"/>

  <!-- Letra M -->
  <path d="M 185 355 L 185 175 L 256 288 L 327 175 L 327 355" stroke="url(#mFill)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hoja -->
  <path d="M 352 402 Q 356 344 432 334 Q 404 396 352 402 Z" fill="url(#leafFill)"/>
  <path d="M 366 392 Q 392 366 420 344" stroke="#2f7d1e" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
